
name: Build Persona 3 Portable APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.30.5"

      - name: Download source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download p3p-source-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Persona3Portable-source-modified.zip" \
            --dir .

      - name: Extract and prepare project
        run: |
          unzip -q Persona3Portable-source-modified.zip -d source

          test -d source/EmuCoreA-master

          cd source/EmuCoreA-master

          # Sediakan folder resources yang tidak ada di source archive
          mkdir -p native-ui/resources

          # Gunakan Android SDK API 36
          sed -i 's/release(37)/release(36)/g' app/build.gradle.kts
          sed -i '/minorApiLevel = 2/d' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

          sed -i 's/release(37)/release(36)/g' native-ui/android/build.gradle.kts
          sed -i '/minorApiLevel = 2/d' native-ui/android/build.gradle.kts

          # Konfigurasi Firebase sementara agar proses build bisa berjalan
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "emucorea-build-placeholder",
              "storage_bucket": "emucorea-build-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.sbro.emucorea"
                  }
                },
                "api_key": [
                  {
                    "current_key": "placeholder-api-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build debug APK
        working-directory: source/EmuCoreA-master
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persona3Portable-debug-apk
          path: source/EmuCoreA-master/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
