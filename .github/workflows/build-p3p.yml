
name: Build Persona 3 Portable APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Rust for Android shader runtime
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.30.5"

      - name: Verify Android build components
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"
          test -f "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/ndk/29.0.14206865/source.properties"
          test -x "$ANDROID_SDK_ROOT/cmake/3.30.5/bin/cmake"
          rustc --version
          cargo --version
          rustup target list --installed | grep -Fx 'aarch64-linux-android'

      - name: Download source archive from this repository's Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download p3p-source-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Persona3Portable-source-modified.zip" \
            --dir .

          test -s Persona3Portable-source-modified.zip

      - name: Extract and prepare project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q Persona3Portable-source-modified.zip -d source

          PROJECT_DIR="source/EmuCoreA-master"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/core/CMakeLists.txt"
          test -f "$PROJECT_DIR/core-native/build.gradle.kts"

          cd "$PROJECT_DIR"

          # Disable Firebase because no matching Firebase client is included.
          rm -f app/google-services.json

          # Create the expected optional native UI resource directory.
          mkdir -p native-ui/resources

      - name: Build debug APK
        working-directory: source/EmuCoreA-master
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persona3Portable-debug-apk
          path: source/EmuCoreA-master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
